<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portail de suivi — ADM VALUE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f7;--card:#fff;--soft:#f5f6fb;--border:#e4e7f2;--text:#3b4268;--muted:#7b83a6;--blue:#4a89c4;--shadow:0 6px 24px rgba(80,90,140,.09)}
[data-theme="dark"]{--bg:#12162b;--card:#1b2038;--soft:#232948;--border:#2f3659;--text:#e6e9f7;--muted:#a5aed0;--blue:#78afe0;--shadow:0 6px 24px rgba(0,0,0,.22)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column}
button,input{font:inherit}
.header{background:linear-gradient(135deg,#2b3358,#4a89c4);color:white;padding:38px 28px}
.header-inner{max-width:1120px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:24px}
.brand{margin-bottom:12px;font-size:12px;font-weight:700;letter-spacing:2px;opacity:.8}
h1{margin:0;font-size:clamp(25px,4vw,38px);letter-spacing:-.8px}
.subtitle{margin:12px 0 0;font-size:14px;line-height:1.6;opacity:.85}
.theme-button{flex-shrink:0;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:white;padding:10px 16px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:600}
main{width:100%;max-width:1176px;margin:0 auto;padding:30px 28px 48px;flex:1}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
h2{margin:0;font-size:20px}
.count{margin:7px 0 0;color:var(--muted);font-size:12px}
.search{width:min(100%,340px);padding:13px 16px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);outline:none}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.dashboard-card{display:flex;flex-direction:column;padding:26px;background:var(--card);border:1px solid var(--border);border-top:4px solid var(--accent);border-radius:18px;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.dashboard-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(60,80,130,.15)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.monogram{width:54px;height:54px;display:grid;place-items:center;border-radius:15px;background:var(--soft);color:var(--accent);font-size:24px;font-weight:800}
.category{background:var(--soft);color:var(--muted);padding:7px 11px;border-radius:20px;font-size:11px;font-weight:600}
.dashboard-card h3{margin:22px 0 10px;font-size:24px;letter-spacing:-.5px}
.description{margin:0 0 26px;color:var(--muted);font-size:13px;line-height:1.8;flex:1}
.open-link{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent);color:white;padding:13px 16px;border-radius:11px;text-decoration:none;font-size:12px;font-weight:700}
.open-link:hover{filter:brightness(1.08)}
.new-tab{text-align:center;margin:10px 0 0;color:var(--muted);font-size:10px}
.empty{color:var(--muted);padding:35px 0;text-align:center}
footer{border-top:1px solid var(--border);padding:20px;text-align:center;color:var(--muted);font-size:11px}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
@media(max-width:600px){.header{padding:28px 20px}.header-inner{align-items:flex-start;flex-direction:column}main{padding:24px 20px 36px}.toolbar{align-items:stretch;flex-direction:column}.search{width:100%}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.dashboard-card{transition:none}.dashboard-card:hover{transform:none}}
/* Bandeau : grand logo à gauche et thème discret en haut à droite */
.header {
  position: relative;
  padding: 18px 34px;
  background: #2e324f;
  color: #ffffff;
}
.header-inner {
  max-width: none;
  min-height: 170px;
  margin: 0;
  display: flex;
  flex-direction: row;
  justify-content: flex-start;
  align-items: center;
  gap: 42px;
}
.header-logo {
  display: block;
  width: 280px;
  height: auto;
  flex-shrink: 0;
}
.header-title {
  padding-right: 130px;
}
.header-title h1 {
  margin: 0;
  font-size: clamp(25px, 3vw, 38px);
  letter-spacing: -0.8px;
}
.header-title .subtitle {
  margin: 12px 0 0;
  font-size: 14px;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.75);
  opacity: 1;
}
.theme-button {
  position: absolute;
  top: 16px;
  right: 22px;
  padding: 7px 11px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.04);
  color: rgba(255, 255, 255, 0.7);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease;
}
.theme-button:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #ffffff;
}
@media (max-width: 700px) {
  .header {
    padding: 42px 20px 24px;
  }
  .header-inner {
    min-height: auto;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
  }
  .header-logo {
    width: 220px;
    max-width: 100%;
  }
  .header-title {
    padding-right: 0;
  }
  .header-title h1 {
    font-size: 28px;
  }
  .theme-button {
    top: 12px;
    right: 14px;
  }
}
</style>
 </head>
<body>
<header class="header">
  <div class="header-inner">
    <img
      class="header-logo"
      src="./logo-adm.png"
      alt="ADM VALUE"
    >
   <div class="header-title">  <h1>Votre performance, en un regard</h1>  <p class="subtitle">    Accédez à vos dashboards et gardez le cap sur vos objectifs.  </p></div>
    <button
      class="theme-button"
      id="themeButton"
      type="button"
      aria-label="Changer le thème"
    >
      Mode sombre
    </button>
  </div>
</header>
<main>
 <div class="toolbar">
  <div><h2>Vos dashboards</h2><p class="count" id="count" aria-live="polite"></p></div>
  <input class="search" id="search" type="search" placeholder="Rechercher un dashboard..." aria-label="Rechercher un dashboard">
 </div>
 <div class="grid" id="dashboardGrid"></div>
 <p class="empty" id="empty" hidden>Aucun dashboard ne correspond à votre recherche.</p>
</main>
<footer>ADM VALUE · Portail central des dashboards de suivi</footer>
<script>
/* Ajouter les futurs dashboards dans cette liste. */
const DASHBOARDS = [
 {nom:"LIRIS",categorie:"Production",description:"Accédez au dashboard de production et aux indicateurs de suivi LIRIS.",url:"https://rinowebadm-art.github.io/DASH-BOARD-LIRIS/",couleur:"#4a89c4"},
 {nom:"ASAP",categorie:"Production",description:"Retrouvez le suivi de production, la DMT et les indicateurs de qualité ASAP.",url:"https://rinowebadm-art.github.io/DASH-BOARD-ASAP/",couleur:"#b9682d"}
];
const grid=document.getElementById("dashboardGrid");
const search=document.getElementById("search");
const count=document.getElementById("count");
const empty=document.getElementById("empty");
const themeButton=document.getElementById("themeButton");
function normaliser(texte){return texte.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();}
function creerElement(tag,classe,texte){
 const element=document.createElement(tag);
 if(classe)element.className=classe;
 if(texte!==undefined)element.textContent=texte;
 return element;
}
function afficherDashboards(){
 const termes=normaliser(search.value).trim().split(/\s+/).filter(Boolean);
 const resultats=DASHBOARDS.filter(d=>{
  const contenu=normaliser(d.nom+" "+d.categorie+" "+d.description);
  return termes.every(t=>contenu.includes(t));
 });
 const fragment=document.createDocumentFragment();
 resultats.forEach(d=>{
  const carte=creerElement("article","dashboard-card");
  carte.style.setProperty("--accent",d.couleur);
  const haut=creerElement("div","card-top");
  haut.append(creerElement("div","monogram",d.nom.charAt(0)),creerElement("span","category",d.categorie));
  const lien=creerElement("a","open-link");
  lien.href=d.url;lien.target="_blank";lien.rel="noopener noreferrer";
  lien.setAttribute("aria-label","Ouvrir le dashboard "+d.nom+" dans un nouvel onglet");
  const fleche=creerElement("span","","↗");fleche.setAttribute("aria-hidden","true");
  lien.append(creerElement("span","","Ouvrir le dashboard"),fleche);
  carte.append(haut,creerElement("h3","",d.nom),creerElement("p","description",d.description),lien,creerElement("p","new-tab","Ouverture dans un nouvel onglet"));
  fragment.append(carte);
 });
 grid.replaceChildren(fragment);
 empty.hidden=resultats.length>0;
 count.textContent=resultats.length===DASHBOARDS.length
  ?resultats.length+" dashboard"+(resultats.length>1?"s disponibles":" disponible")
  :resultats.length+" sur "+DASHBOARDS.length+" dashboards affichés";
}
function appliquerTheme(theme){
 document.documentElement.dataset.theme=theme;
 themeButton.textContent=theme==="dark"?"Mode clair":"Mode sombre";
 themeButton.setAttribute("aria-pressed",String(theme==="dark"));
}
let themeInitial=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
try{
 const sauvegarde=localStorage.getItem("adm-portail-theme");
 if(sauvegarde==="light"||sauvegarde==="dark")themeInitial=sauvegarde;
}catch(erreur){}
themeButton.addEventListener("click",()=>{
 const theme=document.documentElement.dataset.theme==="dark"?"light":"dark";
 appliquerTheme(theme);
 try{localStorage.setItem("adm-portail-theme",theme);}catch(erreur){}
});
search.addEventListener("input",afficherDashboards);
appliquerTheme(themeInitial);
afficherDashboards();
</script>
  <style>
  /* Cartes du portail inspirées des dashboards */
  .adm-dashboard-card {
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
    padding: 30px !important;
    border: 1px solid rgba(255, 255, 255, 0.20) !important;
    border-radius: 24px !important;
    color: #effaff !important;
    box-shadow: 0 14px 32px rgba(24, 40, 65, 0.16) !important;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .adm-dashboard-card.adm-liris {
    background: linear-gradient(135deg, #193f52, #28758a) !important;
    --adm-accent: #7bddf0;
  }
  .adm-dashboard-card.adm-asap {
    background: linear-gradient(135deg, #343457, #62558b) !important;
    --adm-accent: #c6b3ff;
  }
  /* Petite barre lumineuse supérieure */
  .adm-dashboard-card::before {
    content: "";
    position: absolute;
    top: 0;

    width: 36%;

  }
  .adm-dashboard-card:hover {

    box-shadow: 0 22px 42px rgba(24, 40, 65, 0.24) !important;
  }
  .adm-dashboard-card .adm-card-title {
    margin: 22px 0 12px !important;
    color: #f1fbff !important;
    font-size: clamp(30px, 3vw, 40px) !important;
    font-weight: 800 !important;
    line-height: 1.15;
    letter-spacing: -1px;
  }
  .adm-dashboard-card p {
    color: #dde7f4 !important;
    line-height: 1.65;
  }
  /* Icône et badge Production */
  .adm-dashboard-card .adm-card-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 58px;
    height: 58px;
    border-radius: 17px !important;
    background: rgba(255, 255, 255, 0.12) !important;

  }
  .adm-dashboard-card .adm-card-badge {

    font-size: 12px !important;
  }
  /* Bouton façon bandeau translucide des indicateurs */
  .adm-dashboard-card .adm-card-button {
    box-sizing: border-box;
    display: flex !important;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 50px;
    margin-top: 28px !important;
    padding: 14px 18px !important;
    border-radius: 14px !important;
    border: 1px solid rgba(255, 255, 255, 0.20) !important;
    background: rgba(255, 255, 255, 0.14) !important;
    color: #ffffff !important;
    font-weight: 700;
    text-decoration: none;
    box-shadow: none !important;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .adm-dashboard-card .adm-card-button:hover {
    background: rgba(255, 255, 255, 0.24) !important;
    border-color: var(--adm-accent) !important;
  }
  .adm-dashboard-card .adm-card-button:focus-visible {
    outline: 3px solid var(--adm-accent);
    outline-offset: 4px;
  }
  .adm-dashboard-card .adm-card-note {
    display: block;
    margin-top: 12px !important;
    color: #d0dced !important;
    font-size: 11px !important;
    text-align: center;
    opacity: 0.8;
  }
  @media (max-width: 700px) {
    .adm-dashboard-card {
      padding: 24px !important;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .adm-dashboard-card,
    .adm-dashboard-card .adm-card-button {
      transition: none;
    }
    .adm-dashboard-card:hover {
      transform: none;
    }
  }
</style>
<style>
  /* Verre transparent : aucun changement du fond de page */
  .grid {
    --glass-fill: rgba(255, 255, 255, 0.16);
    --glass-edge: rgba(255, 255, 255, 0.95);
    --glass-reflection: rgba(255, 255, 255, 0.55);
    --glass-control: rgba(255, 255, 255, 0.22);
    --glass-hover: rgba(255, 255, 255, 0.36);
    --glass-glow: rgba(92, 166, 225, 0.24);
  }
  [data-theme="dark"] .grid {
    --glass-fill: rgba(255, 255, 255, 0.035);
    --glass-edge: rgba(200, 231, 255, 0.75);
    --glass-reflection: rgba(255, 255, 255, 0.14);
    --glass-control: rgba(255, 255, 255, 0.045);
    --glass-hover: rgba(255, 255, 255, 0.10);
    --glass-glow: rgba(114, 199, 255, 0.25);
  }
  .dashboard-card {
    position: relative;
    overflow: hidden;
    padding: 30px;
    background: var(--glass-fill);
    border: 1px solid var(--glass-edge);
    border-radius: 30px;
    backdrop-filter: blur(12px) saturate(130%);
    -webkit-backdrop-filter: blur(12px) saturate(130%);
    box-shadow:
      inset 0 1px 0 var(--glass-reflection),
      inset 0 0 18px rgba(150, 215, 255, 0.06),
      0 0 14px var(--glass-glow),
      0 14px 30px rgba(25, 47, 85, 0.10);
    transition:
      transform 0.25s ease,
      background 0.25s ease,
      box-shadow 0.25s ease;
  }
  /* Reflet léger sur le verre, sans masquer le contenu */
  .dashboard-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(
      125deg,
      var(--glass-reflection),
      transparent 32%,
      transparent 75%,
      rgba(155, 219, 255, 0.07)
    );
    opacity: 0.35;
  }
  .dashboard-card > * {
    position: relative;
    z-index: 1;
  }
  .dashboard-card:hover {
    transform: translateY(-4px);
    background: var(--glass-control);
    box-shadow:
      inset 0 1px 0 var(--glass-reflection),
      0 0 24px var(--glass-glow),
      0 20px 38px rgba(25, 47, 85, 0.16);
  }
  /* Pastille ronde avec contour lumineux */
 .dashboard-card .monogram {    
   width: 62px;    
   height: 62px;    
   border-radius: 50%;    
   background: linear-gradient(135deg, #ffad42, #ed7418);    
   border: 1px solid rgba(255, 224, 180, 0.95);    
   color: #ffffff;    font-size: 28px;    
   box-shadow:      
     inset 0 1px 0 rgba(255, 255, 255, 0.45),      
     0 0 16px rgba(255, 145, 45, 0.35);  
 }
  .dashboard-card .category {
    padding: 7px 13px;
    background: var(--glass-control);
    border: 1px solid var(--glass-edge);
    color: var(--text);
  }
  .dashboard-card h3 {
    margin: 24px 0 12px;
    color: var(--text);
    font-size: clamp(30px, 3vw, 38px);
    font-weight: 800;
    letter-spacing: -1px;
  }
  .dashboard-card .description {
    margin-bottom: 28px;
    color: var(--text);
    font-size: 13px;
    line-height: 1.8;
  }
  /* Bouton transparent : plus de fond bleu ou orange opaque */
  .dashboard-card .open-link {
    min-height: 50px;
    padding: 14px 18px;
    border-radius: 24px;
    background: var(--glass-control);
    border: 1px solid var(--glass-edge);
    color: var(--text);
    box-shadow:
      inset 0 1px 0 var(--glass-reflection),
      0 0 10px var(--glass-glow);
    transition:
      background 0.2s ease,
      box-shadow 0.2s ease;
  }
  .dashboard-card .open-link:hover {
    background: var(--glass-hover);
    filter: none;
    box-shadow:
      inset 0 1px 0 var(--glass-reflection),
      0 0 18px var(--glass-glow);
  }
  .dashboard-card .new-tab {
    margin-top: 12px;
    color: var(--muted);
    font-size: 10px;
  }
  @media (max-width: 700px) {
    .dashboard-card {
      padding: 24px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .dashboard-card,
    .dashboard-card .open-link {
      transition: none;
    }
    .dashboard-card:hover {
      transform: none;
    }
  }
</style>
  <script>
(function () {
  const logo = document.querySelector(".header-logo");
  const bandeau = document.querySelector(".header");
  if (!logo || !bandeau) return;
  function harmoniserCouleur() {
    if (!logo.naturalWidth || !logo.naturalHeight) return;
    try {
      const canvas = document.createElement("canvas");
      canvas.width = logo.naturalWidth;
      canvas.height = logo.naturalHeight;
      const contexte = canvas.getContext("2d", {
        willReadFrequently: true
      });
      if (!contexte) return;
      contexte.drawImage(logo, 0, 0);
      const pixel = contexte.getImageData(0, 0, 1, 1).data;
      if (pixel[3] !== 255) return;
      bandeau.style.background =
        "rgb(" + pixel[0] + ", " + pixel[1] + ", " + pixel[2] + ")";
    } catch (erreur) {
      console.warn("Impossible de lire la couleur du logo.", erreur);
    }
  }
  if (logo.complete) {
    harmoniserCouleur();
  } else {
    logo.addEventListener("load", harmoniserCouleur, { once: true });
  }
})();
</script>
